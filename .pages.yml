media:
- name: veranstaltungsbilder
  label: Veranstaltungsbilder
  input: public/bilder/veranstaltungen
  output: /bilder/veranstaltungen
  extensions:
  - jpg
  - jpeg
  - png
  - webp
- name: galeriebilder
  label: Über uns – Galeriebilder
  input: public/bilder/ueber-uns
  output: /bilder/ueber-uns
  extensions:
  - jpg
  - jpeg
  - png
  - webp
- name: partnerbilder
  label: Kooperationspartner – Logos
  input: public/bilder/partner
  output: /bilder/partner
  extensions:
  - jpg
  - jpeg
  - png
  - webp
- name: spielortbilder
  label: Spielorte – Anfahrt und Wegbeschreibungen
  input: public/bilder/spielorte
  output: /bilder/spielorte
  extensions:
  - jpg
  - jpeg
  - png
  - webp
content:
- name: veranstaltungen
  label: Veranstaltungsformate
  type: collection
  path: src/content/veranstaltungen
  format: json
  filename: '{primary}.json'
  operations:
    create: false
    rename: false
    delete: false
  view:
    primary: titel
    fields:
    - titel
    - typ
    - rhythmus
    - standardBeginn
    - standardEnde
    sort:
    - titel
    search:
    - titel
    - ort
  fields:
  - name: id
    label: Technische Kennung (nicht ändern)
    type: string
    readonly: true
  - name: titel
    label: Name der Veranstaltung
    type: string
    required: true
  - name: untertitel
    label: Untertitel
    type: string
    required: true
  - name: beschreibung
    label: Beschreibung
    type: text
    required: true
  - name: typ
    label: Veranstaltungsart
    type: select
    required: true
    options:
      values:
      - name: regelmaessig
        label: Regelmäßige Veranstaltung
      - name: unregelmaessig
        label: Unregelmäßige Veranstaltung
      - name: grossveranstaltung
        label: Einzelne Großveranstaltungen
  - name: rhythmus
    label: Üblicher Rhythmus / Hinweise zur Regelmäßigkeit
    type: text
    required: true
    description: Nur zur Information. Es werden daraus keine zukünftigen Termine erfunden.
  - name: standardBeginn
    label: Übliche Startzeit (HH:MM)
    type: string
  - name: standardEnde
    label: Übliche Endzeit (HH:MM) – leer bei Open End
    type: string
  - name: ort
    label: Allgemeiner Veranstaltungsort
    type: text
    required: true
  - name: teilnahme
    label: Teilnahme / Anmeldung
    type: text
    required: true
  - name: buttonText
    label: Button – Beschriftung (optional)
    type: string
    description: Z. B. „Jetzt bei IKEA anmelden“ oder „Zur Thalia-Aktion“. Nur verwenden, wenn auch eine Button-URL eingetragen wird.
  - name: buttonUrl
    label: Button – Link (optional, vollständige HTTPS-Adresse)
    type: string
    pattern: '^https://.+'
    description: Insbesondere für IKEA/Thalia. Leer lassen = bisheriger Link zu „Wo wird gespielt?“. Externe Links öffnen in einem neuen Tab.
  - name: hinweise
    label: Zusätzliche Hinweise
    type: text
    list: true
  - name: bild
    label: Flyerpfad (technisch – vorerst nicht ändern)
    type: string
    readonly: true
  - name: bildBreite
    label: Bildbreite (technisch)
    type: number
    readonly: true
  - name: bildHoehe
    label: Bildhöhe (technisch)
    type: number
    readonly: true
- name: termine
  label: Einzeltermine
  type: collection
  path: src/content/termine
  format: json
  filename: '{datum}-{format}.json'
  operations:
    create: true
    rename: false
    delete: true
  view:
    primary: datum
    fields:
    - datum
    - format
    - beginn
    - ende
    - status
    sort:
    - datum
    search:
    - format
    default:
      sort: datum
      order: desc
  fields:
  - name: format
    label: Veranstaltungsformat
    type: select
    required: true
    options:
      values:
      - name: rheingespielt
        label: Rheingespielt
      - name: offener-brettspieleabend
        label: Offener Brettspieleabend
      - name: ikea
        label: After-Work IKEA
      - name: vorhang-auf
        label: Vorhang auf für Brettspiele
      - name: xxl-spieletag
        label: XXL-Spieletag
      - name: thalia
        label: Thalia
  - name: datum
    label: Datum des Einzeltermins
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: beginn
    label: Beginn (HH:MM)
    type: string
    required: true
    description: Beispiel 18:30. Immer die tatsächliche Zeit des Einzeltermins eintragen.
    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
  - name: ende
    label: Ende (HH:MM) – leer bei Open End
    type: string
    description: Beispiel 20:30. Bei Open End leer lassen.
  - name: status
    label: Status
    type: select
    required: true
    options:
      values:
      - name: bestaetigt
        label: Bestätigt
      - name: abgesagt
        label: Abgesagt
      - name: verschoben
        label: Verschoben
  - name: hinweis
    label: Zusatzhinweis zu Absage / Verschiebung
    type: text
    description: Bei Verschiebung Ersatztermin erläutern. Den neuen Termin zusätzlich als eigenen bestätigten Einzeltermin anlegen.
- name: ueber_uns_galerie
  label: Bildergalerie Über uns
  type: file
  path: src/content/ueber-uns-galerie.json
  format: json
  list: true
  operations:
    delete: false
    rename: false
  fields:
  - name: bild
    label: Foto
    type: image
    required: true
    options:
      media: galeriebilder
      extensions:
      - jpg
      - jpeg
      - png
      - webp
  - name: titel
    label: Bildtitel
    type: string
    required: true
  - name: beschreibung
    label: Bildunterschrift
    type: text
  - name: alt
    label: Alternativtext für barrierefreie Nutzung
    type: text
    required: true
    description: Beschreibe den Bildinhalt knapp und sachlich, nicht nur „Foto“.
- name: partner
  label: Kooperationspartner
  type: file
  path: src/content/partner.json
  format: json
  list: true
  operations:
    delete: false
    rename: false
  fields:
  - name: id
    label: Interne Kennung (bestehende Einträge nicht ändern)
    type: string
    readonly: true
    description: Bei neuen Partnern darf dieses Feld leer bleiben.
  - name: name
    label: Name des Partners
    type: string
    required: true
  - name: beschreibung
    label: Beschreibung
    type: text
    required: true
  - name: logo
    label: Logo
    type: image
    required: true
    options:
      media: partnerbilder
      extensions:
      - jpg
      - jpeg
      - png
      - webp
  - name: website
    label: Website (vollständige HTTPS-Adresse)
    type: string
    required: true
    pattern: ^https://.+
- name: spielorte
  label: Spielorte und Wegbeschreibungen
  type: file
  path: src/content/spielorte.json
  format: json
  operations:
    delete: false
    rename: false
  fields:
  - name: einleitung
    label: Einleitung der Seite „Wo wird gespielt?“
    type: text
    required: true
  - name: kardinal
    label: Spielort 01 – Kardinal-Bea-Haus
    type: object
    fields:
    - name: name
      label: Name des Spielorts
      type: string
      required: true
    - name: beschreibung
      label: Beschreibung des Spielorts
      type: text
      required: true
    - name: eingang
      label: Zugang / Straße und Hausnummer
      type: string
      required: true
    - name: plzOrt
      label: Postleitzahl und Ort
      type: string
      required: true
    - name: gebaeudeadresse
      label: Alternative Gebäudeadresse
      type: string
      required: true
    - name: zugangshinweis
      label: Zusatzhinweis zum Weg ab dem Eingang
      type: text
      required: true
    - name: titelbild
      label: Großes Foto des Kardinal-Bea-Hauses
      type: image
      required: true
      options:
        media: spielortbilder
        extensions:
        - jpg
        - jpeg
        - png
        - webp
    - name: titelbildAlt
      label: Alternativtext für das große Foto
      type: text
      required: true
    - name: route
      label: Google Maps – Routenlink
      type: string
      required: true
      pattern: ^https://.+
    - name: karte
      label: OpenStreetMap – Kartenlink
      type: string
      required: true
      pattern: ^https://.+
    - name: kartenhinweis
      label: Einleitung zu den Kartenlinks
      type: text
      required: true
    - name: haltestellen
      label: ÖPNV-Haltestellen und Fußwegkarten
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{name}'
      fields:
      - name: name
        label: Haltestelle
        type: string
        required: true
      - name: beschreibung
        label: Beschreibung und Fußweg
        type: text
        required: true
      - name: bild
        label: Fußweg-Karte
        type: image
        required: true
        options:
          media: spielortbilder
          extensions:
          - jpg
          - jpeg
          - png
          - webp
      - name: alt
        label: Alternativtext der Karte
        type: text
        required: true
      - name: breite
        label: Bildbreite (optional)
        type: number
        description: Technische Angabe; bei neuen Bildern leer lassen.
      - name: hoehe
        label: Bildhöhe (optional)
        type: number
        description: Technische Angabe; bei neuen Bildern leer lassen.
    - name: oepnvHinweis
      label: Hinweis unter den ÖPNV-Karten
      type: text
      required: true
    - name: autoBeschreibung
      label: Anfahrt mit dem Auto / Parkplatzbeschreibung
      type: text
      required: true
    - name: parkbild
      label: Parkplatzfoto
      type: image
      required: true
      options:
        media: spielortbilder
        extensions:
        - jpg
        - jpeg
        - png
        - webp
    - name: parkbildAlt
      label: Alternativtext für das Parkplatzfoto
      type: text
      required: true
    - name: wegschritte
      label: Weg zum Spieltisch – Fotos und Schritte
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{text}'
      fields:
      - name: bild
        label: Foto für diesen Schritt
        type: image
        required: true
        options:
          media: spielortbilder
          extensions:
          - jpg
          - jpeg
          - png
          - webp
      - name: text
        label: Wegbeschreibung des Schritts
        type: text
        required: true
      - name: alt
        label: Alternativtext für das Bild
        type: text
        required: true
      - name: breite
        label: Ursprüngliche Bildbreite (optional)
        type: number
        description: Technische Bildgröße. Bei neuen Fotos leer lassen.
      - name: hoehe
        label: Ursprüngliche Bildhöhe (optional)
        type: number
        description: Technische Bildgröße. Bei neuen Fotos leer lassen.
  - name: theater
    label: Spielort 02 – Rheinisches Landestheater
    type: object
    fields:
    - name: name
      label: Name des Spielorts
      type: string
      required: true
    - name: beschreibung
      label: Beschreibung des Spielorts
      type: text
      required: true
    - name: eingang
      label: Straße und Hausnummer
      type: string
      required: true
    - name: plzOrt
      label: Postleitzahl und Ort
      type: string
      required: true
    - name: anreiseBeschreibung
      label: Anreise mit Bahn und Auto
      type: text
      required: true
    - name: route
      label: Google Maps – Routenlink
      type: string
      required: true
      pattern: ^https://.+
    - name: website
      label: Website mit Anreiseinformationen
      type: string
      required: true
      pattern: ^https://.+
    - name: logo
      label: Theaterlogo (wird neben dem Text angezeigt)
      type: image
      required: true
      options:
        media: partnerbilder
        extensions:
        - jpg
        - jpeg
        - png
        - webp
    - name: bereichHinweis
      label: Hinweis, dass Foyer oder Altes Herzstück genutzt werden
      type: text
      required: true
    - name: foyerEinleitung
      label: Offenes Foyer – Einführung
      type: text
      required: true
    - name: foyerSchritte
      label: Offenes Foyer – Fotos und Schritte
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{text}'
      fields:
      - name: bild
        label: Foto für diesen Schritt
        type: image
        required: true
        options:
          media: spielortbilder
          extensions:
          - jpg
          - jpeg
          - png
          - webp
      - name: text
        label: Wegbeschreibung des Schritts
        type: text
        required: true
      - name: alt
        label: Alternativtext für das Bild
        type: text
        required: true
      - name: breite
        label: Ursprüngliche Bildbreite (optional)
        type: number
        description: Technische Bildgröße. Bei neuen Fotos leer lassen.
      - name: hoehe
        label: Ursprüngliche Bildhöhe (optional)
        type: number
        description: Technische Bildgröße. Bei neuen Fotos leer lassen.
    - name: herzstueckBeschreibung
      label: Altes Herzstück – Beschreibung
      type: text
      required: true
    - name: herzstueckBild
      label: Altes Herzstück – Orientierungsfoto
      type: image
      required: true
      options:
        media: spielortbilder
        extensions:
        - jpg
        - jpeg
        - png
        - webp
    - name: herzstueckBildAlt
      label: Alternativtext für das Orientierungsfoto
      type: text
      required: true
    - name: herzstueckBildtext
      label: Bildunterschrift für das Alte Herzstück
      type: text
      required: true
- name: seitentexte
  label: Allgemeine Seitentexte
  type: file
  path: src/content/seitentexte.json
  format: json
  operations:
    delete: false
    rename: false
  fields:
  - name: startseite
    label: Startseite
    type: object
    fields:
    - name: heroTitel
      label: Startseite – Hauptüberschrift
      type: string
      required: true
    - name: heroText
      label: Startseite – Begrüßungstext
      type: text
      required: true
      description: Für Hervorhebungen **fett** oder *kursiv* schreiben. Kein HTML einfügen.
    - name: ablaufTitel
      label: Überschrift – So läuft’s bei uns
      type: string
      required: true
    - name: infokarten
      label: Vier Informationskarten (Reihenfolge bearbeitbar)
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titel}'
      fields:
      - name: titel
        label: Überschrift
        type: string
        required: true
      - name: text
        label: Text der Karte
        type: text
        required: true
    - name: partnerTitel
      label: Überschrift – Kooperationspartner
      type: string
      required: true
    - name: spielorteTitel
      label: Überschrift – Wo wird gespielt?
      type: string
      required: true
    - name: spielorteText
      label: Spielorte – Beschreibung auf der Startseite
      type: text
      list: true
      required: true
      description: Jeder Listeneintrag ist ein eigener Absatz. **fett** und *kursiv* sind möglich.
    - name: spielorteButton
      label: Button zum Spielort
      type: string
      required: true
    - name: instagramTitel
      label: Instagram – Überschrift
      type: string
      required: true
    - name: instagramText
      label: Instagram – Beschreibung
      type: text
      required: true
    - name: instagramButton
      label: Instagram – Button-Text
      type: string
      required: true
  - name: veranstaltungen
    label: Veranstaltungsseite
    type: object
    fields:
    - name: sliderTitel
      label: Startseite – Überschrift über den Veranstaltungsslides
      type: string
      required: true
    - name: titel
      label: Veranstaltungsseite – Hauptüberschrift
      type: string
      required: true
    - name: einleitung
      label: Veranstaltungsseite – Einleitung
      type: text
      required: true
  - name: ueberUns
    label: Über uns
    type: object
    fields:
    - name: titel
      label: Über uns – Hauptüberschrift
      type: string
      required: true
    - name: abschnitte
      label: Über uns – Einleitungstexte (Absätze)
      type: text
      list: true
      required: true
      description: Jeder Eintrag ist ein Absatz. **fett** oder *kursiv* schreiben, nicht HTML.
    - name: foerdervereinButton
      label: Button – Förderverein
      type: string
      required: true
    - name: galerieTitel
      label: Bildergalerie – Überschrift
      type: string
      required: true
    - name: galerieEinleitung
      label: Bildergalerie – Einleitung
      type: text
      required: true
  - name: kontakt
    label: Kontaktbereich
    type: object
    fields:
    - name: titel
      label: Kontaktformular – Überschrift
      type: string
      required: true
  - name: danke
    label: Bestätigungsseite nach Nachricht
    type: object
    fields:
    - name: titel
      label: Dankeseite – Hauptüberschrift
      type: string
      required: true
    - name: text
      label: Dankeseite – Bestätigung
      type: text
      required: true
    - name: hinweis
      label: Dankeseite – Zusatzhinweis
      type: text
      required: true
    - name: button
      label: Dankeseite – Button zur Startseite
      type: string
      required: true
  - name: fusszeile
    label: Fußzeile
    type: object
    fields:
    - name: hinweis
      label: Kurzer Hinweis unten auf jeder Seite
      type: string
      required: true
